<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
    <defs>
        <!-- Soft glow filter for starbursts and orbits -->
        <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Deep ambient wash gradients -->
    <radialGradient id="amb-cyan" cx="15%" cy="20%" r="50%">
        <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.10"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-magenta" cx="85%" cy="75%" r="50%">
        <stop offset="0%" stop-color="#ff33cc" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-center" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="#0a192f" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#020509" stop-opacity="0.9"/>
    </radialGradient>

    <!-- Base ambient rects -->
    <rect width="100%" height="100%" fill="#040911"/>
    <rect width="100%" height="100%" fill="url(#amb-center)"/>
    <rect width="100%" height="100%" fill="url(#amb-cyan)"/>
    <rect width="100%" height="100%" fill="url(#amb-magenta)"/>

    <!-- ========================================================
         1. Y2K ORBITAL ELLIPSES & STARBURSTS (Kabisat Retro Techno)
         ======================================================== -->
    <!-- Major Top-Left Orbit -->
    <g transform="translate(320, 280) rotate(-26)" opacity="0.45">
        <!-- Main outer ellipse -->
        <ellipse cx="0" cy="0" rx="460" ry="160" fill="none" stroke="#5cefff" stroke-width="1.6" filter="url(#glow-cyan)"/>
        <!-- Concentric inner dashed ring -->
        <ellipse cx="0" cy="0" rx="452" ry="154" fill="none" stroke="#ff55e1" stroke-width="1" stroke-dasharray="14 6 4 6" opacity="0.7"/>
        <!-- Secondary nested orbital wire -->
        <ellipse cx="0" cy="0" rx="340" ry="115" fill="none" stroke="rgba(92, 239, 255, 0.35)" stroke-width="0.8" stroke-dasharray="2 6"/>
        
        <!-- Y2K 4-Point Starburst at top apex -->
        <g transform="translate(460, 0)">
            <path d="M 0,-32 Q 0,0 28,0 Q 0,0 0,32 Q 0,0 -28,0 Q 0,0 0,-32 Z" fill="#5cefff" filter="url(#glow-cyan)"/>
            <circle cx="0" cy="0" r="3" fill="#ffffff"/>
        </g>
        <!-- Orbit satellite dot -->
        <circle cx="-460" cy="0" r="4.5" fill="#ffe14a" opacity="0.9"/>
        <circle cx="0" cy="160" r="3" fill="#ff55e1" opacity="0.8"/>
    </g>

    <!-- Secondary Bottom-Right Orbit -->
    <g transform="translate(1600, 820) rotate(24)" opacity="0.40">
        <ellipse cx="0" cy="0" rx="520" ry="180" fill="none" stroke="#ff55e1" stroke-width="1.8" filter="url(#glow-magenta)"/>
        <ellipse cx="0" cy="0" rx="512" ry="174" fill="none" stroke="#5cefff" stroke-width="1" stroke-dasharray="10 5" opacity="0.8"/>
        <!-- Starburst on bottom orbit -->
        <g transform="translate(-520, 0)">
            <path d="M 0,-24 Q 0,0 22,0 Q 0,0 0,24 Q 0,0 -22,0 Q 0,0 0,-24 Z" fill="#ff55e1" filter="url(#glow-magenta)"/>
            <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
        </g>
        <circle cx="520" cy="0" r="4" fill="#5cefff"/>
    </g>

    <!-- Mid-Left Satellite Wireframe Orbit -->
    <g transform="translate(120, 780) rotate(-12)" opacity="0.25">
        <ellipse cx="0" cy="0" rx="280" ry="95" fill="none" stroke="#ffe14a" stroke-width="1.2" stroke-dasharray="6 6"/>
        <circle cx="280" cy="0" r="3" fill="#ffe14a"/>
    </g>

    <!-- Top-Right Wireframe Globe / Technical Sphere (Y2K icon) -->
    <g transform="translate(1760, 160)" opacity="0.30">
        <circle cx="0" cy="0" r="50" fill="none" stroke="#5cefff" stroke-width="1.2"/>
        <ellipse cx="0" cy="0" rx="50" ry="20" fill="none" stroke="#5cefff" stroke-width="0.8"/>
        <ellipse cx="0" cy="0" rx="50" ry="36" fill="none" stroke="#5cefff" stroke-width="0.8"/>
        <line x1="0" y1="-50" x2="0" y2="50" stroke="#5cefff" stroke-width="0.8"/>
        <line x1="-50" y1="0" x2="50" y2="0" stroke="#5cefff" stroke-width="0.8"/>
        <!-- Small stamp text -->
        <text x="-48" y="68" fill="#5cefff" font-family="'Consolas', monospace" font-size="9" letter-spacing="2">CLASSIC Y2K</text>
    </g>

    <!-- ========================================================
         2. CRINKLED FOIL / POSTER PAPER FOLDS (Organic, not grid!)
         ======================================================== -->
    <!-- Major diagonal diagonal fold 1 -->
    <path d="M -80,240 Q 420,310 980,220 T 2050,340" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.8"/>
    <path d="M -80,242 Q 420,312 980,222 T 2050,342" fill="none" stroke="rgba(0,0,0,0.55)" stroke-width="2.2"/>

    <!-- Fold 2: vertical curved spine crease -->
    <path d="M 460,-60 Q 490,480 430,860 T 480,1200" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>
    <path d="M 461,-60 Q 491,480 431,860 T 481,1200" fill="none" stroke="rgba(0,0,0,0.45)" stroke-width="2"/>

    <!-- Fold 3: right vertical crease -->
    <path d="M 1480,-60 Q 1440,520 1510,910 T 1470,1200" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>
    <path d="M 1481,-60 Q 1441,520 1511,910 T 1471,1200" fill="none" stroke="rgba(0,0,0,0.45)" stroke-width="2"/>

    <!-- Diagonal cross crease -->
    <path d="M -40,840 Q 650,780 1320,890 T 2020,810" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.4"/>
    <path d="M -40,842 Q 650,782 1320,892 T 2020,812" fill="none" stroke="rgba(0,0,0,0.40)" stroke-width="1.8"/>

    <!-- Wrinkle branches / crinkle micro-creases -->
    <g opacity="0.6">
        <path d="M 280,180 L 330,220 L 360,205" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <path d="M 640,260 L 675,295 L 720,285" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.8"/>
        <path d="M 1250,210 L 1290,240 L 1330,225" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.8"/>
        <path d="M 1680,680 L 1720,720 L 1750,705" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <path d="M 210,640 L 250,680 L 290,660" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.8"/>
    </g>

    <!-- ========================================================
         3. GRUNGE SPATTERS & FILM GRAIN SPECKS (Organic distribution)
         ======================================================== -->
    <g fill="rgba(255,255,255,0.18)">
        <!-- Cluster 1 (top left) -->
        <circle cx="85" cy="120" r="1.5"/><circle cx="92" cy="128" r="0.8"/><circle cx="78" cy="135" r="1.2"/>
        <circle cx="110" cy="95" r="0.9"/><circle cx="65" cy="145" r="1.8"/><circle cx="125" cy="140" r="0.7"/>
        <circle cx="140" cy="115" r="1.4"/><circle cx="95" cy="160" r="1.0"/><circle cx="70" cy="100" r="0.6"/>

        <!-- Cluster 2 (mid left) -->
        <circle cx="60" cy="480" r="1.6"/><circle cx="75" cy="495" r="1.1"/><circle cx="50" cy="510" r="0.8"/>
        <circle cx="90" cy="470" r="1.3"/><circle cx="45" cy="460" r="1.0"/><circle cx="80" cy="525" r="0.9"/>

        <!-- Cluster 3 (bottom left) -->
        <circle cx="120" cy="940" r="1.8"/><circle cx="135" cy="955" r="1.0"/><circle cx="105" cy="970" r="1.3"/>
        <circle cx="150" cy="930" r="0.7"/><circle cx="95" cy="920" r="1.2"/><circle cx="140" cy="980" r="1.5"/>

        <!-- Cluster 4 (top right) -->
        <circle cx="1820" cy="320" r="1.4"/><circle cx="1835" cy="335" r="0.9"/><circle cx="1805" cy="350" r="1.7"/>
        <circle cx="1850" cy="310" r="1.1"/><circle cx="1795" cy="300" r="0.8"/><circle cx="1840" cy="360" r="1.3"/>

        <!-- Cluster 5 (mid right) -->
        <circle cx="1860" cy="620" r="1.5"/><circle cx="1875" cy="635" r="0.8"/><circle cx="1845" cy="650" r="1.2"/>
        <circle cx="1890" cy="610" r="1.0"/><circle cx="1835" cy="600" r="1.6"/><circle cx="1880" cy="660" r="0.7"/>

        <!-- Cluster 6 (bottom right) -->
        <circle cx="1740" cy="980" r="1.7"/><circle cx="1755" cy="995" r="1.1"/><circle cx="1725" cy="1010" r="0.9"/>
        <circle cx="1770" cy="970" r="1.3"/><circle cx="1715" cy="960" r="1.5"/><circle cx="1760" cy="1020" r="0.8"/>
    </g>

    <g fill="rgba(92,239,255,0.25)">
        <circle cx="180" cy="360" r="1.8"/><circle cx="240" cy="210" r="1.2"/><circle cx="1680" cy="740" r="1.6"/>
        <circle cx="1730" cy="880" r="1.4"/><circle cx="210" cy="850" r="1.5"/><circle cx="1620" cy="240" r="1.3"/>
    </g>

    <g fill="rgba(255,85,225,0.25)">
        <circle cx="290" cy="420" r="1.5"/><circle cx="1590" cy="790" r="1.8"/><circle cx="1770" cy="460" r="1.3"/>
        <circle cx="140" cy="610" r="1.4"/><circle cx="1820" cy="850" r="1.2"/><circle cx="310" cy="140" r="1.6"/>
    </g>

    <!-- Isolated 4-point Starbursts scattered in margins -->
    <g transform="translate(180, 160)" opacity="0.45">
        <path d="M 0,-16 Q 0,0 14,0 Q 0,0 0,16 Q 0,0 -14,0 Q 0,0 0,-16 Z" fill="#5cefff"/>
    </g>
    <g transform="translate(1780, 520)" opacity="0.35">
        <path d="M 0,-14 Q 0,0 12,0 Q 0,0 0,14 Q 0,0 -12,0 Q 0,0 0,-14 Z" fill="#ff55e1"/>
    </g>
    <g transform="translate(140, 680)" opacity="0.35">
        <path d="M 0,-12 Q 0,0 10,0 Q 0,0 0,12 Q 0,0 -10,0 Q 0,0 0,-12 Z" fill="#ffe14a"/>
    </g>
    <g transform="translate(1690, 920)" opacity="0.40">
        <path d="M 0,-18 Q 0,0 16,0 Q 0,0 0,18 Q 0,0 -16,0 Q 0,0 0,-18 Z" fill="#5cefff"/>
    </g>

    <!-- ========================================================
         4. CORNER REGISTRATION CROSSHAIRS & TECHNICAL DOSSIER MARKS
         ======================================================== -->
    <g stroke="rgba(92,239,255,0.3)" stroke-width="1.2">
        <!-- Top Left -->
        <line x1="30" y1="20" x2="30" y2="40"/><line x1="20" y1="30" x2="40" y2="30"/>
        <!-- Top Right -->
        <line x1="1890" y1="20" x2="1890" y2="40"/><line x1="1880" y1="30" x2="1900" y2="30"/>
        <!-- Bottom Left -->
        <line x1="30" y1="1040" x2="30" y2="1060"/><line x1="20" y1="1050" x2="40" y2="1050"/>
        <!-- Bottom Right -->
        <line x1="1890" y1="1040" x2="1890" y2="1060"/><line x1="1880" y1="1050" x2="1900" y2="1050"/>
    </g>
</svg>
