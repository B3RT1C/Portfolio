<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480">
    <defs>
        <!-- Glow filters -->
        <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="glow-magenta" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- 4-point Starburst definition -->
        <g id="star-cyan">
            <path d="M 0,-14 Q 0,0 12,0 Q 0,0 0,14 Q 0,0 -12,0 Q 0,0 0,-14 Z" fill="#5cefff" filter="url(#glow-cyan)"/>
            <circle cx="0" cy="0" r="1.8" fill="#ffffff"/>
        </g>
        <g id="star-magenta">
            <path d="M 0,-11 Q 0,0 9.5,0 Q 0,0 0,11 Q 0,0 -9.5,0 Q 0,0 0,-11 Z" fill="#ff55e1" filter="url(#glow-magenta)"/>
            <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
        </g>
        <g id="star-yellow">
            <path d="M 0,-8 Q 0,0 7,0 Q 0,0 0,8 Q 0,0 -7,0 Q 0,0 0,-8 Z" fill="#ffe14a"/>
            <circle cx="0" cy="0" r="1.2" fill="#ffffff"/>
        </g>
    </defs>

    <!-- Base deep cyber tone -->
    <rect width="320" height="480" fill="#040911"/>

    <!-- Soft radial ambient highlights on the tile -->
    <circle cx="80" cy="120" r="90" fill="rgba(92, 239, 255, 0.05)"/>
    <circle cx="240" cy="360" r="90" fill="rgba(255, 85, 225, 0.04)"/>

    <!-- ========================================================
         SEAMLESS ORBITAL LINES (Slope = -240 / 320 = -0.75)
         Line 1: from (0, 360) to (320, 120)
         Line 2: from (0, 120) to (160, 0) and wraps from (160, 480) to (320, 360)
         ======================================================== -->
    <g opacity="0.45">
        <!-- Main Line 1 -->
        <line x1="0" y1="360" x2="320" y2="120" stroke="#5cefff" stroke-width="1.4" filter="url(#glow-cyan)"/>
        <line x1="0" y1="364" x2="320" y2="124" stroke="#ff55e1" stroke-width="0.8" stroke-dasharray="10 6 3 6" opacity="0.7"/>

        <!-- Main Line 2 (wrapped upper and lower halves) -->
        <line x1="0" y1="120" x2="160" y2="0" stroke="#5cefff" stroke-width="1.4" filter="url(#glow-cyan)"/>
        <line x1="0" y1="124" x2="160" y2="4" stroke="#ff55e1" stroke-width="0.8" stroke-dasharray="10 6 3 6" opacity="0.7"/>

        <line x1="160" y1="480" x2="320" y2="360" stroke="#5cefff" stroke-width="1.4" filter="url(#glow-cyan)"/>
        <line x1="160" y1="484" x2="320" y2="364" stroke="#ff55e1" stroke-width="0.8" stroke-dasharray="10 6 3 6" opacity="0.7"/>
    </g>

    <!-- Secondary faint dotted orbital trajectory -->
    <g opacity="0.25">
        <line x1="0" y1="240" x2="320" y2="0" stroke="#ffe14a" stroke-width="1" stroke-dasharray="4 6"/>
        <line x1="0" y1="480" x2="320" y2="240" stroke="#ffe14a" stroke-width="1" stroke-dasharray="4 6"/>
    </g>

    <!-- Subtle tilted orbital loop around each glass position -->
    <!-- Glass 1 center is approx (80, 120) -->
    <g transform="translate(80, 120) rotate(-22)" opacity="0.30">
        <ellipse cx="0" cy="0" rx="58" ry="24" fill="none" stroke="#5cefff" stroke-width="1" stroke-dasharray="6 4"/>
        <circle cx="58" cy="0" r="2.2" fill="#ffe14a"/>
    </g>

    <!-- Glass 2 center is approx (240, 360) -->
    <g transform="translate(240, 360) rotate(-22)" opacity="0.30">
        <ellipse cx="0" cy="0" rx="58" ry="24" fill="none" stroke="#ff55e1" stroke-width="1" stroke-dasharray="6 4"/>
        <circle cx="-58" cy="0" r="2.2" fill="#5cefff"/>
    </g>

    <!-- ========================================================
         SEAMLESS 4-POINT STARBURSTS
         ======================================================== -->
    <!-- Star 1 along Line 1 -->
    <use href="#star-cyan" x="160" y="240"/>

    <!-- Star 2 along Line 2 upper -->
    <use href="#star-magenta" x="80" y="60"/>

    <!-- Star 3 along Line 2 lower -->
    <use href="#star-magenta" x="240" y="420"/>

    <!-- Smaller satellite stars -->
    <use href="#star-yellow" x="290" y="140"/>
    <use href="#star-yellow" x="30" y="340"/>
    <use href="#star-cyan" x="210" y="190" transform="scale(0.7)"/>
    <use href="#star-magenta" x="50" y="430" transform="scale(0.6)"/>

    <!-- ========================================================
         ORGANIC FOLD / CREASE LINES & GRUNGE SPECKS
         ======================================================== -->
    <!-- Faint paper fold lines -->
    <path d="M 0,210 Q 160,230 320,195" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.2"/>
    <path d="M 0,211 Q 160,231 320,196" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="1.5"/>

    <!-- Technical registration crosshairs on margins -->
    <g stroke="rgba(92,239,255,0.22)" stroke-width="1">
        <line x1="20" y1="15" x2="20" y2="25"/><line x1="15" y1="20" x2="25" y2="20"/>
        <line x1="180" y1="255" x2="180" y2="265"/><line x1="175" y1="260" x2="185" y2="260"/>
    </g>

    <!-- Organic micro specks -->
    <g fill="rgba(255,255,255,0.2)">
        <circle cx="120" cy="45" r="1"/><circle cx="125" cy="52" r="0.6"/>
        <circle cx="270" cy="280" r="1.2"/><circle cx="282" cy="290" r="0.7"/>
        <circle cx="40" cy="180" r="0.9"/><circle cx="48" cy="175" r="1.3"/>
        <circle cx="210" cy="80" r="1.1"/><circle cx="205" cy="92" r="0.8"/>
        <circle cx="140" cy="390" r="1.2"/><circle cx="152" cy="405" r="0.7"/>
    </g>
</svg>