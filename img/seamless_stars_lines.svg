<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480">
    <defs>
        <!-- Soft, muted 4-point star (unchanged contrast and colors) -->
        <g id="star-subdued-cyan">
            <path d="M 0,-11 Q 0,0 9,0 Q 0,0 0,11 Q 0,0 -9,0 Q 0,0 0,-11 Z" fill="rgba(92, 239, 255, 0.38)"/>
            <circle cx="0" cy="0" r="1.2" fill="rgba(180, 245, 255, 0.6)"/>
        </g>
        <g id="star-subdued-magenta">
            <path d="M 0,-8.5 Q 0,0 7,0 Q 0,0 0,8.5 Q 0,0 -7,0 Q 0,0 0,-8.5 Z" fill="rgba(255, 85, 225, 0.32)"/>
            <circle cx="0" cy="0" r="1" fill="rgba(255, 190, 245, 0.5)"/>
        </g>
    </defs>

    <!-- Deep dark background -->
    <rect width="320" height="480" fill="#040911"/>

    <!-- Very soft ambient wash -->
    <circle cx="160" cy="240" r="140" fill="rgba(92, 239, 255, 0.02)"/>

    <!-- ========================================================
         SUBDUED STARS (Doubled density: 4 stars per 320x480 tile)
         Exact same contrast, colors, and opacity preserved
         ======================================================== -->
    <use href="#star-subdued-cyan" x="230" y="80"/>
    <use href="#star-subdued-magenta" x="70" y="320"/>
    <use href="#star-subdued-cyan" x="160" y="230"/>
    <use href="#star-subdued-magenta" x="260" y="430"/>
</svg>
