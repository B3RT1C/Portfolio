<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480">
    <defs>
        <!-- Soft, muted 4-point star (keeps approved subdued brightness) -->
        <g id="star-subdued-cyan">
            <path d="M 0,-11 Q 0,0 9,0 Q 0,0 0,11 Q 0,0 -9,0 Q 0,0 0,-11 Z" fill="rgba(92, 239, 255, 0.38)"/>
            <circle cx="0" cy="0" r="1.2" fill="rgba(180, 245, 255, 0.6)"/>
        </g>
        <g id="star-subdued-magenta">
            <path d="M 0,-8.5 Q 0,0 7,0 Q 0,0 0,8.5 Q 0,0 -7,0 Q 0,0 0,-8.5 Z" fill="rgba(255, 85, 225, 0.32)"/>
            <circle cx="0" cy="0" r="1" fill="rgba(255, 190, 245, 0.5)"/>
        </g>
    </defs>

    <!-- Deep dark background -->
    <rect width="320" height="480" fill="#040911"/>

    <!-- Very soft ambient wash -->
    <circle cx="160" cy="240" r="140" fill="rgba(92, 239, 255, 0.02)"/>

    <!-- ========================================================
         VISIBLE SEAMLESS ORBITAL LINES (Opacity 0.40)
         Solid Cyan + Parallel Dashed Magenta
         Seamlessly wrapped at tile boundaries (Slope = -0.75)
         ======================================================== -->
    <g opacity="0.40">
        <!-- Main Line 1 (Cyan Solid) -->
        <line x1="0" y1="360" x2="320" y2="120" stroke="#5cefff" stroke-width="1.1"/>
        <!-- Main Line 2 (Cyan Solid - wrapped) -->
        <line x1="0" y1="120" x2="160" y2="0" stroke="#5cefff" stroke-width="1.1"/>
        <line x1="160" y1="480" x2="320" y2="360" stroke="#5cefff" stroke-width="1.1"/>

        <!-- Companion Line 1 (Magenta Dashed) -->
        <line x1="0" y1="364" x2="320" y2="124" stroke="#ff55e1" stroke-width="0.8" stroke-dasharray="10 6 3 6" opacity="0.75"/>
        <!-- Companion Line 2 (Magenta Dashed - wrapped) -->
        <line x1="0" y1="124" x2="165.33" y2="0" stroke="#ff55e1" stroke-width="0.8" stroke-dasharray="10 6 3 6" opacity="0.75"/>
        <line x1="165.33" y1="480" x2="320" y2="364" stroke="#ff55e1" stroke-width="0.8" stroke-dasharray="10 6 3 6" opacity="0.75"/>
    </g>

    <!-- ========================================================
         SUBDUED STARS (Preserved exact approved brightness)
         ======================================================== -->
    <use href="#star-subdued-cyan" x="230" y="80"/>
    <use href="#star-subdued-magenta" x="70" y="320"/>
</svg>
